<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GHEvents net-matching QA</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.3.1/ol.css">
  <style>
    html, body, #map { height: 100%; margin: 0; }
    #map { width: 100%; }
    #panel {
      position: absolute; top: 10px; right: 10px; z-index: 10;
      background: rgba(255,255,255,.94); padding: 10px 12px; border-radius: 8px;
      font: 13px/1.4 system-ui, sans-serif; box-shadow: 0 1px 6px rgba(0,0,0,.3); max-width: 240px;
    }
    #panel label { display: block; margin: 2px 0; cursor: pointer; }
    #status { margin-top: 6px; color: #555; font-size: 12px; }
    #legend span { display: inline-block; width: 11px; height: 11px; margin-right: 4px; border-radius: 2px; vertical-align: middle; }
    #popup {
      position: fixed; background: #fff; border: 1px solid #999; border-radius: 6px;
      padding: 7px 9px; font: 12px/1.35 system-ui, sans-serif; max-width: 380px;
      box-shadow: 0 2px 8px rgba(0,0,0,.3); pointer-events: none; display: none; z-index: 12;
    }
    #popup .cap { white-space: pre-wrap; word-break: break-word; margin-bottom: 4px; }
    #popup hr { border: none; border-top: 1px solid #ddd; margin: 5px 0; }
    #popup table, #info table { border-collapse: collapse; }
    #popup td, #info td { padding: 0 6px 0 0; vertical-align: top; }
    #popup td.k, #info td.k { color: #666; white-space: nowrap; }
    #info {
      position: absolute; top: 10px; left: 10px; z-index: 11; display: none;
      background: #fff; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,.35);
      font: 12px/1.4 system-ui, sans-serif; width: 390px; max-height: calc(100% - 20px);
      overflow: auto; padding: 10px 12px;
    }
    #info h3 { margin: 0 0 6px; font-size: 14px; }
    #info .cap { white-space: pre-wrap; word-break: break-word; background: #f6f6f6; padding: 6px; border-radius: 4px; margin-bottom: 8px; }
    #info .close { position: absolute; top: 8px; right: 10px; cursor: pointer; color: #888; font-size: 16px; }
    #info details { border-top: 1px solid #eee; padding: 4px 0; }
    #info summary { cursor: pointer; }
    #info summary:hover { background: #eef6ff; }
    #info .edetail { margin: 4px 0 4px 14px; }
    #info .muted { color: #888; }
    #info .round { color: #c00; font-weight: bold; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="popup"></div>
  <div id="info"></div>
  <div id="panel">
    <strong>GHEvents QA</strong>
    <label><input type="checkbox" id="cbNet" checked> GraphHopper net (edges)</label>
    <label><input type="checkbox" id="cbEvents" checked> GHEvents (DATEX)</label>
    <div id="legend">
      <div><span style="background:#e11"></span>block (factor&lt;0)</div>
      <div><span style="background:#f90"></span>penalty (factor&gt;1)</div>
      <div><span style="background:#39f"></span>info / other</div>
    </div>
    <div id="status">Zoom in to load events.</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/ol@10.3.1/dist/ol.js"></script>
  <script>
  const API = location.origin;
  // z where MVTResource renders the COMPLETE network (its "zInfo > 12" branch); both the
  // net and events overlays are gated here so they appear together like the full graph.
  const NET_MIN_ZOOM = 13;
  const MIN_EVENT_ZOOM = NET_MIN_ZOOM;
  const wkt = new ol.format.WKT();
  const esc = s => String(s == null ? '' : s).replace(/[&<>]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;' }[c]));
  const wayOf = e => e.ext_edge_id != null ? e.ext_edge_id : e.extEdgeId;   // GH serializes snake_case
  const readGeom = s => wkt.readGeometry(s, { dataProjection:'EPSG:4326', featureProjection:'EPSG:3857' });
  const state = { hoverWays: null, hoverKey: null };
  const loadedIds = new Set();   // ext_ids currently loaded, to detect _dir2 companions
  // The Berlin feed emits a per-carriageway companion (X_1 <-> X_dir2_1) for both-direction
  // closures, so a matched-one-way record whose twin is also present is actually fine.
  function companion(id) {
    id = String(id);
    if (id.includes('_dir2_')) return id.replace('_dir2_', '_');
    const m = id.match(/^(.*)_(\d+)$/);
    return m ? `${m[1]}_dir2_${m[2]}` : null;
  }
  function companionLine(id) {
    const c = companion(id);
    if (c && loadedIds.has(c)) return `<div style="color:#080;margin-bottom:6px">↔ opposite-direction companion loaded: <b>${esc(c)}</b> — both carriageways covered</div>`;
    return '';
  }

  // layers bottom->top; highlights sit ABOVE events so they show through the DATEX line
  const base = new ol.layer.Tile({ source: new ol.source.OSM() });
  const mvtSource = new ol.source.VectorTile({ format: new ol.format.MVT(),
    url: API + '/mvt/{z}/{x}/{y}.mvt?render_all=true', minZoom: NET_MIN_ZOOM });
  const netLayer = new ol.layer.VectorTile({ source: mvtSource, minZoom: NET_MIN_ZOOM,
    style: new ol.style.Style({ stroke: new ol.style.Stroke({ color: 'rgba(90,90,90,.55)', width: 1 }) }) });

  const eventSource = new ol.source.Vector();
  function eventStyle(feature) {
    const f = feature.get('factor');
    let color = 'rgba(51,153,255,.55)';
    if (typeof f === 'number' && f < 0) color = 'rgba(238,17,17,.55)';
    else if (typeof f === 'number' && f > 1) color = 'rgba(255,153,0,.6)';
    if (feature.getGeometry().getType() === 'Point')
      return new ol.style.Style({ image: new ol.style.Circle({ radius: 6,
        fill: new ol.style.Fill({ color }), stroke: new ol.style.Stroke({ color: '#333', width: 1 }) }) });
    return new ol.style.Style({ stroke: new ol.style.Stroke({ color, width: 5 }) });
  }
  const eventLayer = new ol.layer.Vector({ source: eventSource, style: eventStyle, minZoom: NET_MIN_ZOOM });

  // hovering/clicking a record highlights ALL edges of its matched ways (osm_way_id set)
  const hoverWayLayer = new ol.layer.VectorTile({ source: mvtSource, minZoom: NET_MIN_ZOOM, renderMode: 'vector',
    style: function (feature) {
      if (!state.hoverWays) return null;
      const w = feature.get('osm_way_id'); if (w == null) return null;
      if (!state.hoverWays.has(String(w).split(' ')[0])) return null;
      return [ new ol.style.Style({ stroke: new ol.style.Stroke({ color: '#fff', width: 9 }) }),
               new ol.style.Style({ stroke: new ol.style.Stroke({ color: '#00e5ff', width: 5 }) }) ];
    } });
  // a single way highlighted by hovering a row in the click-info list (topmost)
  const pickSource = new ol.source.Vector();
  const pickLayer = new ol.layer.Vector({ source: pickSource, style: [
    new ol.style.Style({ stroke: new ol.style.Stroke({ color: '#fff', width: 10 }) }),
    new ol.style.Style({ stroke: new ol.style.Stroke({ color: '#ff00d0', width: 5 }) }) ] });

  const map = new ol.Map({ target: 'map', layers: [base, netLayer, eventLayer, hoverWayLayer, pickLayer],
    view: new ol.View({ center: ol.proj.fromLonLat([13.404, 52.52]), zoom: 13 }) });

  const cbNet = document.getElementById('cbNet'), cbEvents = document.getElementById('cbEvents');
  const status = document.getElementById('status');
  cbNet.onchange = () => { netLayer.setVisible(cbNet.checked); hoverWayLayer.setVisible(cbNet.checked); };
  cbEvents.onchange = () => { eventLayer.setVisible(cbEvents.checked); cbEvents.checked ? loadEvents() : eventSource.clear(); };

  function bboxOf4326() {
    const [a,b,c,d] = ol.proj.transformExtent(map.getView().calculateExtent(map.getSize()), 'EPSG:3857', 'EPSG:4326');
    return `${a},${b},${c},${d}`;
  }
  const SKIP = new Set(['geometry','shape','stat_from','stat_to','edge_id','ext_edge_id']);
  function propTable(props) {
    let rows = '';
    for (const [k,v] of Object.entries(props)) {
      if (SKIP.has(k) || k === 'caption' || v == null || v === '') continue;
      rows += `<tr><td class="k">${esc(k)}</td><td>${esc(Array.isArray(v) ? v.length + ' way(s)' : v)}</td></tr>`;
    }
    return `<table>${rows}</table>`;
  }
  function addShape(shape, props) {
    let n = 0;
    for (const part of String(shape || '').split(';')) {
      const s = part.trim(); if (!s) continue;
      let geom; try { geom = readGeom(s); } catch(e){ continue; }
      const feat = new ol.Feature({ geometry: geom }); feat.setProperties(props, true);
      eventSource.addFeature(feat); n++;
    }
    return n;
  }

  // ---- load events, deduped per DATEX record (one source line, carrying all its ways) ----
  let loadTimer = null;
  const scheduleLoad = () => { clearTimeout(loadTimer); loadTimer = setTimeout(loadEvents, 250); };
  async function loadEvents() {
    if (!cbEvents.checked) return;
    const zoom = map.getView().getZoom();
    if (zoom < MIN_EVENT_ZOOM) { eventSource.clear(); status.textContent = `Zoom in to ≥ ${MIN_EVENT_ZOOM} to load events (now ${zoom.toFixed(1)}).`; return; }
    status.textContent = 'Loading events…';
    try {
      const res = await fetch(`${API}/events?bbox=${bboxOf4326()}`);
      const events = await res.json();
      const byRec = new Map();       // ext_id -> {rep, ways:[]}
      for (const ev of events) {
        const id = ev.ext_id != null ? ev.ext_id : (ev.caption || Math.random());
        let g = byRec.get(id); if (!g) { g = { rep: ev, ways: [] }; byRec.set(id, g); }
        const w = wayOf(ev); if (w != null) g.ways.push(String(w));
      }
      loadedIds.clear(); for (const k of byRec.keys()) loadedIds.add(String(k));
      eventSource.clear(); let n = 0;
      for (const g of byRec.values()) {
        const props = Object.assign({}, g.rep); props.ways = g.ways; delete props.ext_edge_id;
        if (g.rep.shape) n += addShape(g.rep.shape, props);
      }
      const hdr = res.headers.get('X-GH-Events') || '';
      status.textContent = `${byRec.size} records / ${events.length} way-events${hdr.startsWith('truncated')?' (truncated!)':''} · ${n} shapes`;
    } catch (e) { status.textContent = 'Error loading events: ' + e; }
  }
  map.on('moveend', scheduleLoad);
  loadEvents();

  // ---- hover: record info AND (underneath) net-edge info; highlight the record's ways ----
  const popup = document.getElementById('popup');
  map.on('pointermove', function (evt) {
    if (evt.dragging) return;
    const seen = new Set(), evs = []; let edge = null;
    map.forEachFeatureAtPixel(evt.pixel, f => {
      const id = String(f.get('ext_id'));
      if (!seen.has(id)) { seen.add(id); evs.push(f); }
    }, { layerFilter: l => l === eventLayer, hitTolerance: 4 });
    map.forEachFeatureAtPixel(evt.pixel, f => { edge = f; return true; }, { layerFilter: l => l === netLayer, hitTolerance: 3 });

    // highlight the edges of ALL overlapping events (a base + _dir2 companion lights up
    // both carriageways), not just the topmost one.
    const allWays = [];
    for (const f of evs) allWays.push(...(f.get('ways') || []));
    const key = allWays.join(',');
    if (key !== state.hoverKey) { state.hoverKey = key; state.hoverWays = allWays.length ? new Set(allWays) : null; hoverWayLayer.changed(); }

    let html = '';
    if (evs.length > 1) {
      html += `<div style="font-weight:bold;margin-bottom:3px">⧉ ${evs.length} GHEvents here — click to choose</div>`;
      html += evs.map(f => {
        const p = f.getProperties(), fac = p.factor, col = fac < 0 ? '#e11' : fac > 1 ? '#f90' : '#39f';
        return `<div><span style="color:${col}">■</span> ${esc(p.ext_id)} <span style="color:#888">f=${esc(fac)}, ${(p.ways || []).length} ways</span><br><span style="color:#555">${esc((p.caption || '').split('\n')[0].slice(0, 55))}</span></div>`;
      }).join('');
    } else if (evs.length === 1) {
      const p = evs[0].getProperties();
      html += `<div class="cap">${esc(p.caption || '')}</div>` + propTable(p);
    }
    if (edge && cbNet.checked) { html += (evs.length ? '<hr>' : '') + `<div class="cap"><b>edge ${esc(edge.get('edge_id'))}</b> · osm ${esc(edge.get('osm_way_id'))}</div>` + propTable(edge.getProperties()); }
    if (!html) { popup.style.display = 'none'; map.getTargetElement().style.cursor = ''; return; }
    popup.innerHTML = html;
    const oe = evt.originalEvent;
    popup.style.left = Math.min(oe.clientX + 14, window.innerWidth - 400) + 'px';
    popup.style.top = Math.min(oe.clientY + 14, window.innerHeight - 220) + 'px';
    popup.style.display = 'block'; map.getTargetElement().style.cursor = 'pointer';
  });

  // ---- click a record: info window listing ALL matched ways (roundabout flagged) ----
  const info = document.getElementById('info');
  map.on('singleclick', function (evt) {
    // collect ALL events under the cursor (companion records overlap exactly), one per record
    const seen = new Set(), hits = [];
    map.forEachFeatureAtPixel(evt.pixel, f => {
      const id = String(f.get('ext_id'));
      if (!seen.has(id)) { seen.add(id); hits.push(f); }
    }, { layerFilter: l => l === eventLayer, hitTolerance: 4 });
    if (!hits.length) return;
    showRecords(hits, hits[0]);
  });

  function showRecords(hits, active) {
    let chooser = '';
    if (hits.length > 1) {
      chooser = `<div style="margin-bottom:8px">${hits.length} events here — pick one:<br>` + hits.map((f, i) => {
        const p = f.getProperties(), fac = p.factor, col = fac < 0 ? '#e11' : fac > 1 ? '#f90' : '#39f';
        const sel = f === active ? 'background:#eef6ff;font-weight:bold;' : '';
        return `<span class="pick" data-i="${i}" style="cursor:pointer;display:inline-block;margin:3px 4px 0 0;padding:1px 7px;border-radius:10px;border:1px solid #ccc;${sel}"><span style="color:${col}">■</span> ${esc(p.ext_id)}</span>`;
      }).join('') + `</div>`;
    }
    renderRecord(active, chooser);
    if (hits.length > 1)
      info.querySelectorAll('.pick').forEach(el => el.onclick = () => showRecords(hits, hits[+el.dataset.i]));
  }

  function renderRecord(ev, chooserHtml) {
    const p = ev.getProperties();
    const ways = p.ways || [];
    state.hoverWays = new Set(ways); state.hoverKey = ways.join(','); hoverWayLayer.changed();
    info.innerHTML = `<span class="close" title="close">✕</span>` + (chooserHtml || '')
      + `<h3>GHEvent · ${ways.length} matched ways</h3>`
      + `<div class="cap">${esc(p.caption || '')}</div>` + companionLine(p.ext_id) + propTable(p)
      + `<h3 style="margin-top:10px">Matched ways <span class="muted" id="edgeCount">…</span></h3>`
      + `<div id="edges" class="muted">loading…</div>`;
    info.style.display = 'block';
    info.querySelector('.close').onclick = () => { info.style.display = 'none'; pickSource.clear(); };
    loadWays(ev.getGeometry(), ways, p);
  }

  // a way's representative edge is one-way when car_access is "true | false" (fwd yes, rev no)
  const isOneway = e => { const c = e && e.car_access; if (c == null) return false; const p = String(c).split('|'); return p.length === 2 && p[1].trim() === 'false'; };

  async function loadWays(geom, ways, rec) {
    let ext = ol.proj.transformExtent(geom.getExtent(), 'EPSG:3857', 'EPSG:4326');
    const padX = Math.max((ext[2]-ext[0])*0.15, 0.003), padY = Math.max((ext[3]-ext[1])*0.15, 0.003);
    const bbox = `${ext[0]-padX},${ext[1]-padY},${ext[2]+padX},${ext[3]+padY}`;
    try {
      const res = await fetch(`${API}/events/edges?bbox=${bbox}&way=${encodeURIComponent(ways.join(','))}`);
      const edges = await res.json();
      const groups = new Map();
      for (const e of edges) { const w = String(e.osm_way_id); if (!groups.has(w)) groups.set(w, []); groups.get(w).push(e); }
      document.getElementById('edgeCount').textContent = `(${ways.length} ways, ${edges.length} edges in view)`;
      const box = document.getElementById('edges'); box.classList.remove('muted'); box.innerHTML = '';
      let present = 0, oneway = 0;
      for (const w of ways) {
        const es = groups.get(String(w)) || [];
        const rc = es[0] ? (es[0].road_class || '?') : '?';
        const nm = es[0] ? (es[0].street_name || '') : '';
        const round = es[0] && (es[0].roundabout === 'true' || es[0].roundabout === true);
        const ow = isOneway(es[0]);
        if (es.length) { present++; if (ow) oneway++; }
        const d = document.createElement('details');
        let inner = '';
        for (const e of es) {
          let rows = ''; for (const [k,v] of Object.entries(e)) { if (k === 'geometry' || v == null || v === '') continue; rows += `<tr><td class="k">${esc(k)}</td><td>${esc(v)}</td></tr>`; }
          inner += `<div class="edetail"><table>${rows}</table></div>`;
        }
        if (!es.length) inner = '<div class="edetail muted">no edges in view</div>';
        d.innerHTML = `<summary>way ${esc(w)} · ${esc(rc)}${round ? ' <span class="round">roundabout</span>' : ''}${ow ? ' <span class="round">one-way</span>' : ''}${nm ? ' · ' + esc(nm) : ''} · ${es.length} edge(s)</summary>${inner}`;
        const hl = () => { pickSource.clear(); for (const e of es) { if (!e.geometry) continue; try { pickSource.addFeature(new ol.Feature({ geometry: readGeom(e.geometry) })); } catch(x){} } };
        d.querySelector('summary').addEventListener('mouseenter', hl);
        d.addEventListener('mouseleave', () => pickSource.clear());
        box.appendChild(d);
      }
      // A genuine single-carriageway miss: the DATEX text says both directions, all matched
      // ways are one-way, AND there is no _dir2 companion covering the opposite carriageway.
      // (The Berlin feed usually provides that companion, so this stays quiet in practice.)
      const isBoth = /beiden? richtung/i.test((rec && rec.caption) || '');
      const twin = rec && companion(rec.ext_id);
      if (isBoth && present > 0 && oneway === present && !(twin && loadedIds.has(twin))) {
        const warn = document.createElement('div');
        warn.className = 'round'; warn.style.margin = '4px 0 8px';
        warn.textContent = '⚠ both-directions closure, all matched ways are one-way, and no _dir2 companion is loaded — the opposite carriageway may NOT be blocked.';
        box.parentNode.insertBefore(warn, box);
      }
    } catch (e) { document.getElementById('edges').textContent = 'error: ' + e; }
  }
  </script>
</body>
</html>
